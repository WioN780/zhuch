name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          # ./... already excludes vendor/ (third-party code isn't ours to
          # reformat); gofmt -l . would walk it and flag upstream files.
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      # tests/test_parity.py auto-skips here (no ARENA_URL set)
      - name: pytest
        run: pytest

  # Genuine Go <-> Python parity gate: real arena binary vs the Python
  # reference implementation, via POST /forward (contracts.md section 4).
  integration:
    needs: [go, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/pyproject.toml
      - name: Build arena
        working-directory: backend
        run: go build -o arena ./cmd/arena
      - name: Start arena
        working-directory: backend
        # ponytail: assumes arena honors PORT env (Railway convention);
        # switch to its addr flag if the binary grows one.
        run: PORT=8081 ./arena > arena.log 2>&1 &
      - name: Install training package
        working-directory: training
        run: pip install -e '.[dev]'
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/healthz && exit 0
            sleep 1
          done
          echo "arena never became healthy"
          cat backend/arena.log || true
          exit 1
      - name: Parity tests
        working-directory: training
        env:
          ARENA_URL: http://127.0.0.1:8081
        run: pytest tests/test_parity.py -v
      # Smoke /eval with two scripted tanks (request shape: contracts.md section 4).
      # curl -f fails the step on any non-2xx status.
      - name: Smoke POST /eval
        run: |
          curl -fsS -X POST http://127.0.0.1:8081/eval \
            -H 'Content-Type: application/json' \
            -d '{"seed": 42, "max_ticks": 600, "tanks": [{"name": "s1", "scripted": true}, {"name": "s2", "scripted": true}]}'
      - name: Arena log
        if: always()
        run: cat backend/arena.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json exists in the repo, so npm ci is correct here.
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
