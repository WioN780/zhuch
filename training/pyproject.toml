[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhuch-train"
version = "0.1.0"
description = "Neuroevolution training for zhuch tank bots (GA + OpenAI-ES)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tracking = ["mlflow>=2"]

[tool.setuptools]
packages = ["zhuch_train"]
