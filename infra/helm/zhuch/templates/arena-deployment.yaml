apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zhuch.arena.fullname" . }}
  labels:
    {{- include "zhuch.labels" . | nindent 4 }}
    app.kubernetes.io/component: arena
spec:
  replicas: {{ .Values.arena.replicas }}
  selector:
    matchLabels:
      {{- include "zhuch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: arena
  template:
    metadata:
      labels:
        {{- include "zhuch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: arena
    spec:
      containers:
        - name: arena
          image: "{{ .Values.image.arena.repository }}:{{ .Values.image.arena.tag }}"
          imagePullPolicy: {{ .Values.image.arena.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.arena.port }}
          env:
            - name: ARENA_PORT
              value: {{ .Values.arena.port | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.arena.resources | nindent 12 }}
