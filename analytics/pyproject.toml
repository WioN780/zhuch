[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhuch-analytics"
version = "0.1.0"
description = "Kafka -> Parquet -> Spark analytics pipeline for zhuch telemetry (docs/contracts.md §6)"
requires-python = ">=3.11"
dependencies = ["kafka-python-ng>=2.2", "pyarrow>=15", "numpy>=1.26"]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8"]

# Flat layout: this directory IS the `analytics` package (repo path analytics/sink.py
# == import analytics.sink), so map the package root to ".".
[tool.setuptools]
packages = ["analytics", "analytics.spark_jobs"]
package-dir = {"analytics" = ".", "analytics.spark_jobs" = "spark_jobs"}
